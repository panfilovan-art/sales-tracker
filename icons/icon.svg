<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d3deef" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- лист тетради в клетку -->
  <rect width="512" height="512" fill="#f7f9fd"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <!-- красная линия полей -->
  <rect x="104" y="0" width="8" height="512" fill="#d8404a" opacity=".75"/>
  <!-- столбики «дела за день», растут вверх -->
  <rect x="160" y="300" width="56" height="112" rx="10" fill="#4a5f9e"/>
  <rect x="240" y="236" width="56" height="176" rx="10" fill="#1f3a93"/>
  <rect x="320" y="172" width="56" height="240" rx="10" fill="#1f3a93"/>
  <!-- галочка «цель выполнена» -->
  <path d="M168 196 L222 248 L384 92" fill="none" stroke="#23855a" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
